<script>
(() => {
  "use strict";
  // ---------- util tampilan ----------
  const $ = (s, r = document) => r.querySelector(s);
  function el(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") e.className = v;
      else if (k === "text") e.textContent = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) e.append(k instanceof Node ? k : String(k));
    return e;
  }
  const nf0 = new Intl.NumberFormat("id-ID", { maximumFractionDigits: 0 });
  const nf1 = new Intl.NumberFormat("id-ID", { maximumFractionDigits: 1, minimumFractionDigits: 1 });
  const rp = (x) => "Rp " + nf0.format(Math.round(x || 0));
  function rpK(x) { // ringkas: jt / M
    const a = Math.abs(x || 0), s = x < 0 ? "-" : "";
    if (a >= 1e9) return s + "Rp " + nf1.format(a / 1e9).replace(/,0$/, "") + " M";
    if (a >= 1e6) return s + "Rp " + nf1.format(a / 1e6).replace(/,0$/, "") + " jt";
    return s + "Rp " + nf0.format(a);
  }
  const pct = (x) => (x == null || !isFinite(x)) ? "–" : nf1.format(x * 100) + "%";
  const BLN = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
  const namaBulan = (m) => { const [y, b] = m.split("-"); return BLN[+b - 1] + " " + y; };
  const sum = (rows, f) => rows.reduce((a, r) => a + (+r[f] || 0), 0);
  function groupSum(rows, keyFn, fields) {
    const m = new Map();
    for (const r of rows) {
      const k = keyFn(r);
      let a = m.get(k); if (!a) { a = { key: k }; for (const f of fields) a[f] = 0; m.set(k, a); }
      for (const f of fields) a[f] += +r[f] || 0;
    }
    return [...m.values()];
  }

  // panel saringan kolom gaya Excel: satu yang terbuka sekaligus, tutup lewat klik di luar / Escape
  let saringTerbuka = null;
  function tutupSaringKolom() {
    if (!saringTerbuka) { document.querySelectorAll(".saring-kolom").forEach((p) => p.remove()); return; }
    document.removeEventListener("mousedown", saringTerbuka.luar, true);
    saringTerbuka.pop.remove();
    saringTerbuka = null;
  }
  // tabel yang bisa diurutkan: cols = [{h, f (row=>value), num, fmt, bar, cls, saring:false = tanpa saringan kolom}]
  function table(cols, rows, opts = {}) {
    const wrap = el("div", { class: "tbl-wrap", style: opts.maxH ? "max-height:" + opts.maxH : null });
    const t = el("table");
    const thead = el("thead"), tb = el("tbody");
    let sortI = opts.sort ?? -1, dir = opts.dir || "desc", urut = rows, batas = opts.limit || 0;
    const semuaRows = rows;
    // saringan gaya Excel di tiap judul kolom (Kak Intan 20 Nov 2026: "filternya dibuat kaya gini kaya excel"):
    // saring[i] = Set nilai yang dicentang (null = tidak disaring). Nilai = teks yang tampil di sel.
    const saring = cols.map(() => null);
    const kunciSel = (c, r) => {
      const v = c.f(r);
      let s = v;
      if (c.fmt) { const o = c.fmt(v, r); s = o instanceof Node ? o.textContent : o; }
      s = String(s ?? "").trim();
      return s === "" || s === "–" || s === "-" ? "(Kosong)" : s;
    };
    const lolos = (r, kecuali) => saring.every((st, i) => i === kecuali || !st || st.has(kunciSel(cols[i], r)));
    // tabel panjang ditampilkan bertahap; tombol di bawah tabel menambah barisnya
    const kaki = el("div", { class: "row", style: "gap:8px;align-items:center;margin-top:6px" });
    const trh = el("tr");
    const tombolSaring = [];
    cols.forEach((c, i) => {
      const th = el("th", { class: c.num ? "num" : null, scope: "col", text: c.h, tabindex: "0" });
      if (c.hn) th.append(c.hn());   // isi tambahan di judul kolom (mis. ceklis semua); klik di dalamnya tidak mengurutkan
      const act = () => { if (sortI === i) dir = dir === "asc" ? "desc" : "asc"; else { sortI = i; dir = c.num ? "desc" : "asc"; } draw(); };
      th.addEventListener("click", act);
      th.addEventListener("keydown", (e) => { if (e.key === "Enter") act(); });
      if (c.h && c.saring !== false) {
        const b = el("button", { type: "button", class: "th-saring", "aria-label": "Saring kolom " + c.h, title: "Saring / urutkan kolom " + c.h, text: "▾" });
        b.addEventListener("click", (e) => { e.stopPropagation(); bukaSaring(i, b); });
        b.addEventListener("keydown", (e) => e.stopPropagation());
        tombolSaring[i] = b;
        th.append(b);
      }
      trh.append(th);
    });
    thead.append(trh);
    function bukaSaring(i, tombol) {
      tutupSaringKolom();
      const c = cols[i];
      const hitung = new Map(), mentah = new Map();
      for (const r of semuaRows) if (lolos(r, i)) { const k = kunciSel(c, r); hitung.set(k, (hitung.get(k) || 0) + 1); if (!mentah.has(k)) mentah.set(k, c.f(r)); }
      const nilai = [...hitung.keys()].sort((a, b) => a === "(Kosong)" ? 1 : b === "(Kosong)" ? -1
        : c.num ? (+mentah.get(a) || 0) - (+mentah.get(b) || 0) : String(mentah.get(a) ?? a).localeCompare(String(mentah.get(b) ?? b), "id", { numeric: true }));
      const pilih = new Set(saring[i] ? nilai.filter((v) => saring[i].has(v)) : nilai);
      const cari = el("input", { type: "search", placeholder: "Cari nilai", "aria-label": "Cari nilai kolom " + c.h });
      const daftar = el("div", { class: "sk-daftar", role: "group", "aria-label": "Nilai kolom " + c.h });
      const info = el("div", { class: "sk-info" });
      const MAKS = 500;
      const gambar = () => {
        const q = cari.value.trim().toLowerCase();
        const tampil = q ? nilai.filter((v) => v.toLowerCase().includes(q)) : nilai;
        const semua = tampil.length > 0 && tampil.every((v) => pilih.has(v));
        const cbAll = el("input", { type: "checkbox" }); cbAll.checked = semua; cbAll.indeterminate = !semua && tampil.some((v) => pilih.has(v));
        cbAll.addEventListener("change", () => { for (const v of tampil) cbAll.checked ? pilih.add(v) : pilih.delete(v); gambar(); });
        daftar.replaceChildren(el("label", { class: "sk-item sk-semua" }, cbAll, el("b", { text: q ? "(Pilih semua hasil cari)" : "(Pilih semua)" })),
          ...tampil.slice(0, MAKS).map((v) => {
            const cb = el("input", { type: "checkbox" }); cb.checked = pilih.has(v);
            cb.addEventListener("change", () => { cb.checked ? pilih.add(v) : pilih.delete(v); gambar(); });
            return el("label", { class: "sk-item" }, cb, el("span", { text: v + " (" + nf0.format(hitung.get(v)) + ")" }));
          }));
        info.textContent = nf0.format(tampil.length) + " nilai" + (tampil.length > MAKS ? " · " + nf0.format(MAKS) + " pertama ditampilkan, pakai Cari" : "");
      };
      cari.addEventListener("input", gambar);
      const urutBtn = (teks, d) => el("button", { type: "button", class: "sk-btn", onclick: () => { sortI = i; dir = d; tutupSaringKolom(); draw(); } }, teks);
      const ok = el("button", { type: "button", class: "sk-btn sk-ok", onclick: () => { saring[i] = pilih.size === nilai.length ? null : new Set(pilih); tutupSaringKolom(); batas = opts.limit || 0; draw(); } }, "OK");
      const batal = el("button", { type: "button", class: "sk-btn", onclick: () => tutupSaringKolom() }, "Batal");
      const hapus = el("button", { type: "button", class: "sk-btn sk-lebar", onclick: () => { saring[i] = null; tutupSaringKolom(); draw(); } }, "Hapus saringan");
      const pop = el("div", { class: "saring-kolom", role: "dialog", "aria-label": "Saringan kolom " + c.h },
        el("div", { class: "sk-judul", text: c.h }),
        el("div", { class: "sk-dua" }, urutBtn(c.num ? "Urut kecil → besar" : "Urut A → Z", "asc"), urutBtn(c.num ? "Urut besar → kecil" : "Urut Z → A", "desc")),
        cari, daftar, info, el("div", { class: "sk-dua" }, ok, batal), hapus);
      document.body.append(pop);
      gambar();
      const rc = tombol.getBoundingClientRect(), w = Math.min(320, innerWidth - 16);
      pop.style.width = w + "px";
      pop.style.left = Math.max(8, Math.min(rc.right - w, innerWidth - w - 8)) + "px";
      const atas = rc.bottom + 4, tinggi = pop.offsetHeight;
      pop.style.top = (atas + tinggi > innerHeight - 8 ? Math.max(8, innerHeight - tinggi - 8) : atas) + "px";
      cari.focus();
      pop.addEventListener("keydown", (e) => { if (e.key === "Escape") { tutupSaringKolom(); tombol.focus(); } if (e.key === "Enter" && e.target === cari) ok.click(); });
      setTimeout(() => { saringTerbuka = { pop, luar: (e) => { if (!pop.contains(e.target)) tutupSaringKolom(); } }; document.addEventListener("mousedown", saringTerbuka.luar, true); }, 0);
    }
    const maxBar = {};
    cols.forEach((c, i) => { if (c.bar) maxBar[i] = Math.max(1, ...rows.map((r) => Math.abs(+c.f(r) || 0))); });
    function draw() {
      [...trh.children].forEach((th, i) => th.setAttribute("aria-sort", i === sortI ? (dir === "asc" ? "ascending" : "descending") : "none"));
      const aktif = saring.some(Boolean);
      tombolSaring.forEach((b, i) => { if (b) { b.classList.toggle("aktif", !!saring[i]); b.textContent = saring[i] ? "▼" : "▾"; } });
      rows = aktif ? semuaRows.filter((r) => lolos(r, -1)) : semuaRows;
      if (hapusSemua) hapusSemua.hidden = !aktif;
      const rs = rows.slice();
      if (sortI >= 0) {
        const c = cols[sortI];
        rs.sort((a, b) => { const x = c.f(a), y = c.f(b); const r = c.num ? (x || 0) - (y || 0) : String(x ?? "").localeCompare(String(y ?? ""), "id"); return dir === "asc" ? r : -r; });
      }
      tb.replaceChildren();
      urut = rs;
      const lim = batas ? rs.slice(0, batas) : rs;

  function chartGarisAkum(host, seri) {   // seri: [{warna, titik:[{h, v}], tebal, putus}]

    const W = Math.max(320, host.clientWidth || 700), H = 230, mL = 58, mB = 26, mT = 10, mR = 8;
    const c = warnaCss();
    const maxV = Math.max(1, ...semua.map((p) => p.v)), maxH = Math.max(2, ...semua.map((p) => p.h));
    const x = (h) => mL + (W - mL - mR) * ((h - 1) / (maxH - 1));
    const y = (v) => mT + (H - mT - mB) * (1 - v / maxV);
    const svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, width: "100%", role: "img",
                               "aria-label": "Akumulasi omset berjalan" });

  // ---------- penahan bonus (Kak Intan 30 Okt 2026) ----------
  // "bonus sales slowmoving + masih ada DO yang belum lunas gak" -> bonus TETAP dihitung penuh,
  // barisnya hanya diberi status DITAHAN supaya kelihatan sebelum dibayar. Dua sebabnya:
  //   1. DO belum lunas yang sudah lewat jatuh tempo (data/piutang.json, nomornya DO.xxxx, per sales)
  //   2. stok sangat lambat di cabangnya lewat TAHAN_SLOW (dari umur stok, bukan slow moving lama)
  // Slow moving per sales tidak bisa dihitung dari datanya: stok dibukukan per gudang, tidak ada nama
  // sales di sana - jadi yang dipakai angka cabangnya, dibaca berdampingan dengan porsi target cabang.
  const TAHAN_SLOW = 0.2;
  // tenggang telat DO sebelum bonus ditandai DITAHAN. Tanpa tenggang, 35 dari 41 sales ikut
  // tertanda karena DO telat beberapa hari itu kejadian sehari-hari (uji 30 Okt 2026).
  const TAHAN_HARI = 30;
  function penahanBonus(bon, m) {
    const perSales = new Map();
    for (const p of D.piutang || []) {
      if (!(p.sisa > 0)) continue;
      let a = perSales.get(p.sales_id);
      if (!a) { a = { n: 0, sisa: 0, nOver: 0, over: 0, tua: 0, nTua: 0, tuaRp: 0 }; perSales.set(p.sales_id, a); }
      a.n++; a.sisa += p.sisa;
      if (p.hari_lewat > 0) { a.nOver++; a.over += p.sisa; a.tua = Math.max(a.tua, p.hari_lewat); }
      if (p.hari_lewat > TAHAN_HARI) { a.nTua++; a.tuaRp += p.sisa; }
    }
    const perCabang = new Map();
    for (const r of D.umur_stok || []) {
      let a = perCabang.get(r.cabang);
      if (!a) { a = { nilai: 0, sl: 0 }; perCabang.set(r.cabang, a); }
      a.nilai += r.nilai;
      if (r.status === "SANGAT LAMBAT") a.sl += r.nilai;
    }
    // target cabang = jumlah target sales cabang itu bulan ini. Belum diisi -> dipakai omset cabang,
    // jadi kolomnya tetap terbaca (porsi omset) dan ditandai di barisnya.
    const tgt = new Map(), oms = new Map();
    for (const s of bon) {
      tgt.set(s.cabang, (tgt.get(s.cabang) || 0) + (s.target || 0));
      oms.set(s.cabang, (oms.get(s.cabang) || 0) + (s.omset_ppn || 0));
    }
    for (const s of bon) {
      const d = perSales.get(s.sales_id) || { n: 0, sisa: 0, nOver: 0, over: 0, tua: 0, nTua: 0, tuaRp: 0 };
      const u = perCabang.get(s.cabang) || { nilai: 0, sl: 0 };
      s.do_n = d.n; s.do_sisa = d.sisa; s.do_over_n = d.nOver; s.do_over = d.over; s.do_tua = d.tua;
      s.do_tua_n = d.nTua; s.do_tua_rp = d.tuaRp;
      s.slow_cab = u.nilai ? u.sl / u.nilai : 0; s.slow_cab_rp = u.sl; s.stok_cab = u.nilai;
      const tc = tgt.get(s.cabang) || 0, oc = oms.get(s.cabang) || 0;
      s.target_cab = tc || null;
      s.porsi_cab = tc ? s.omset_ppn / tc : (oc ? s.omset_ppn / oc : null);
      s.sebab_tahan = [];
      if (d.nTua) s.sebab_tahan.push(nf0.format(d.nTua) + " DO telat lebih dari " + TAHAN_HARI + " hari senilai " + rpK(d.tuaRp) + " (terlama " + nf0.format(d.tua) + " hari)");
      if (s.slow_cab > TAHAN_SLOW) s.sebab_tahan.push("stok sangat lambat cabang " + pct(s.slow_cab) + " (" + rpK(u.sl) + ")");
      s.tahan = s.sebab_tahan.length > 0;
    }
  }
  const nodeDO = (r) => !r.do_n ? el("span", { class: "muted", text: "–" })
    : el("span", { title: nf0.format(r.do_n) + " DO belum lunas, sisa " + rpK(r.do_sisa) + (r.do_over_n ? "; " + nf0.format(r.do_over_n) + " di antaranya lewat jatuh tempo, " + nf0.format(r.do_tua_n) + " telat lebih dari " + TAHAN_HARI + " hari" : "; semuanya belum lewat jatuh tempo") },
        el("b", { class: r.do_over_n ? "down" : null, text: rpK(r.do_sisa) }),
        el("div", { class: "muted", style: "font-size:11px", text: nf0.format(r.do_n) + " DO" + (r.do_over_n ? " · " + nf0.format(r.do_over_n) + " lewat tempo " + rpK(r.do_over) : "") }),
        r.do_tua_n ? el("div", { class: "down", style: "font-size:11px", text: nf0.format(r.do_tua_n) + " telat > " + TAHAN_HARI + " hr " + rpK(r.do_tua_rp) }) : null);
  const nodeSlowCab = (r) => !r.stok_cab ? el("span", { class: "muted", text: "–" })
    : el("span", { class: "pill " + (r.slow_cab > TAHAN_SLOW ? "bad" : r.slow_cab > 0.1 ? "warn" : "ok"), title: "Dari umur stok cabang " + r.cabang + ": " + rpK(r.slow_cab_rp) + " dari nilai stok " + rpK(r.stok_cab), text: pct(r.slow_cab) });
  const nodeTahan = (r) => r.tahan
    ? el("span", { class: "pill bad", title: r.sebab_tahan.join("; "), text: "DITAHAN" })
    : el("span", { class: "pill ok", text: "Bisa dibayar" });
  const nodeTargetCab = (r) => r.porsi_cab == null ? el("span", { class: "muted", text: "–" })
    : el("span", { title: r.target_cab ? "Target cabang " + r.cabang + " " + rpK(r.target_cab) + " (jumlah target sales cabang itu bulan ini)" : "Target cabang " + r.cabang + " belum diisi, jadi yang ditampilkan porsi omsetnya terhadap omset cabang" },
        pct(r.porsi_cab), r.target_cab ? null : el("div", { class: "muted", style: "font-size:11px", text: "porsi omset" }));

    if (S.program.some((p) => p.penerima === "sales") || S.harga.length) await muatProgramData(m);
    const bon = hitungBonus(m), ins = insentifSales(m), hs = bonusHargaSpesial(m);
    for (const s of bon) { s.insentif = ins.get(s.sales_id) || 0; s.harga_spesial = hs.get(s.sales_id) || 0; s.rinciProgram = ins.rinci.get(s.sales_id) || []; s.rinciHarga = hs.rinci.get(s.sales_id) || []; const t = S.target[m + "_" + s.sales_id]; s.target = t ? t.target_omset : null; s.capai = s.target ? s.omset_ppn / s.target : null; }

  // isi kolom Est. bonus: perhitungannya dijabarkan per brand (dasar bonus x tarif = bonus)
  function jabarBonus(r) {
    const kecil = (cls, text) => el("div", { class: cls, style: "font-size:11px;white-space:nowrap;font-family:var(--font-ui)", text });

    for (const br of r.brand.values()) {
      if (!br.rinci.size) { baris.push(kecil("warn", br.brand + ": tidak ada tarif → Rp 0 (omset " + rpK(br.omset_ppn) + ")")); continue; }
      for (const x of br.rinci.values()) baris.push(kecil("muted", br.brand + ": " + rpK(x.bersih) + " × " + nf1.format(x.aturan.tarif * 100).replace(/,0$/, "") + "%" + (String(x.aturan.bulan_acuan || "").startsWith("upping") ? " (upping " + (x.aturan.poly && x.aturan.poly.upping != null ? nf1.format(x.aturan.poly.upping * 100) + "%" : "tidak terhitung") + ")" : "") + (x.aturan.dasar === "omset (incl. PPN)" ? "" : " " + (x.aturan.dasar === "selisih jual - modal" ? "selisih" : x.aturan.dasar === "total harga modal" ? "HPP" : "omset ≤ modal")) + " = " + rp(x.bonus)));

    return el("span", null, el("b", { text: rp(r.bonus) }), ...baris);
  }
  // rincian perhitungan satu sales: tiap baris = satu brand x satu aturan dari berkas REKAP BONUS

      if (r.status === "MATI - 0 TERJUAL") a.mati += r.nilai;
      else if (r.status === "SANGAT LAMBAT") a.sl += r.nilai;
      else if (r.status === "LAMBAT") a.l += r.nilai;
      else if (r.status === "PERLU DIPANTAU") a.dp += r.nilai;
      else a.nm += r.nilai;

    return [...m.values()];

  // ---------- grafik komposisi umur stok (Kak Intan 30 Okt 2026: "slowmoving pakai grafik") ----------
  // Satu batang per cabang (atau per merk kalau satu cabang sedang dipilih). Panjang batang = nilai
  // stoknya dibanding yang terbesar, isinya dipecah menurut status umur - jadi sekali pandang kelihatan
  // mana yang nilainya besar DAN mana yang banyak mengendap.
  const UMUR_SEGMEN = [["sl", "SANGAT LAMBAT", "bad"], ["l", "LAMBAT", "warn"], ["dp", "PERLU DIPANTAU", "acc"], ["nm", "NORMAL", "ok"]];
  const UMUR_VAR = { bad: "bad", warn: "warn", acc: "accent", ok: "ok" };
  function chartUmurCabang(host, data) {
    host.replaceChildren();
    const rows = data.filter((d) => d.nilai > 0).sort((a, b) => b.sl - a.sl || b.nilai - a.nilai).slice(0, 14);
    if (!rows.length) { host.append(el("div", { class: "empty", text: "Belum ada nilai stok untuk pilihan ini." })); return; }
    const c = warnaCss(), W = Math.max(320, host.clientWidth || 700), mL = 112, mR = 62, bh = 18, gap = 10;
    const H = rows.length * (bh + gap) + 8, maks = Math.max(...rows.map((d) => d.nilai)), lebar = Math.max(40, W - mL - mR);
    const svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, width: "100%", role: "img",
      "aria-label": "Nilai stok dipecah menurut status umur stok" });
    rows.forEach((d, i) => {
      const y = i * (bh + gap) + 4, total = d.nilai * lebar / maks;
      const nm = svgEl("text", { x: mL - 8, y: y + bh - 4, "text-anchor": "end" });
      nm.textContent = String(d.key).length > 15 ? String(d.key).slice(0, 14) + "…" : d.key;
      const tn = svgEl("title"); tn.textContent = d.key + " · nilai stok " + rpK(d.nilai); nm.append(tn);
      svg.append(nm);
      let x = mL;
      for (const [k, lbl, warna] of UMUR_SEGMEN) {
        const w = (d[k] || 0) / d.nilai * total;
        if (!(w > 0)) continue;
        const r = svgEl("rect", { x: x, width: Math.max(0.8, w), y: y, height: bh, fill: c[warna] });
        const tt = svgEl("title");
        tt.textContent = d.key + " · " + lbl + " " + rpK(d[k]) + " = " + pct(d[k] / d.nilai) + " dari " + rpK(d.nilai);
        r.append(tt); svg.append(r); x += w;
      }
      const buruk = d.sl / d.nilai;
      const tx = svgEl("text", { x: mL + total + 6, y: y + bh - 4, fill: buruk > 0.2 ? c.bad : c.mut });
      tx.textContent = pct(buruk); svg.append(tx);
    });
    host.append(svg,
      el("div", { class: "row", style: "gap:12px;flex-wrap:wrap;margin-top:6px;font-size:12px" },
        ...UMUR_SEGMEN.map(([, lbl, warna]) => el("span", { class: "row", style: "gap:5px;align-items:center" },
          el("span", { style: "width:11px;height:11px;border-radius:2px;display:inline-block;background:var(--" + UMUR_VAR[warna] + ")" }), lbl))),
      el("p", { class: "note", style: "margin:4px 0 0", text: "Angka di kanan batang = porsi nilai stok yang berstatus SANGAT LAMBAT; merah kalau lewat 20%. Panjang batang = nilai stok dibanding yang terbesar. Arahkan kursor ke batang untuk nilai tiap status." }));
  }

    for (const d of pilih) for (const b of d.baris) {
      if (!cocokCab(b.cabang)) continue;
      const total = (b.jual || []).reduce((a, [, q]) => a + q, 0), laku = Math.min(total, b.stok), skala = total ? laku / total : 0;
      rows.push({ ...b, bulan: d.bulan, total, laku, sisa: b.stok - laku, habis: b.stok ? laku / b.stok : 0, skala });

    }

    const unit = sum(rows, "stok"), laku = sum(rows, "laku"), nilaiDaftar = rows.reduce((a, r) => a + r.stok * r.hpp, 0), nilaiLaku = rows.reduce((a, r) => a + r.laku * r.hpp, 0);

  // ---------- retur penjualan ----------
  // grafik batang retur per bulan; tinggi = nilai retur, tooltip = % terhadap omset
  function chartRetur(host, data) {   // data: [{bulan, retur, omset}]
    host.replaceChildren();
    const W = Math.max(280, host.clientWidth || 600), H = 220, mL = 64, mB = 24, mT = 10, mR = 8;
    const max = Math.max(1, ...data.map((d) => d.retur));
    const c = warnaCss();
    const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", role: "img", "aria-label": "Nilai retur per bulan" });
    const y = (v) => mT + (H - mT - mB) * (1 - v / max);
    for (let i = 0; i <= 4; i++) {
      const v = max * i / 4, yy = y(v);
      svg.append(svgEl("line", { x1: mL, x2: W - mR, y1: yy, y2: yy, stroke: c.line }));
      const tx = svgEl("text", { x: mL - 6, y: yy + 4, "text-anchor": "end" }); tx.textContent = rpK(v).replace("Rp ", ""); svg.append(tx);
    }
    const band = (W - mL - mR) / Math.max(1, data.length), bw = Math.min(34, band * 0.5);
    const tip = el("div", { class: "tip", hidden: true });
    data.forEach((d, i) => {
      const cx = mL + band * i + band / 2, top = y(d.retur);
      const r = svgEl("rect", { x: cx - bw / 2, width: bw, y: top, height: Math.max(1, y(0) - top), rx: 3, fill: d.bulan === S.bulan ? c.bad : c.bar });
      svg.append(r);
      const tx = svgEl("text", { x: cx, y: H - 6, "text-anchor": "middle" }); tx.textContent = namaBulan(d.bulan); svg.append(tx);
      r.addEventListener("mouseenter", () => {
        tip.hidden = false;
        tip.replaceChildren(el("div", { class: "muted", text: namaBulan(d.bulan) }), el("div", { text: "Retur " + rpK(d.retur) }), el("div", { text: pct(d.omset ? d.retur / d.omset : null) + " dari omset " + rpK(d.omset) }));
        tip.style.left = Math.min(Math.max(0, cx / W * host.clientWidth - 80), host.clientWidth - 200) + "px"; tip.style.top = "6px";
      });
      r.addEventListener("mouseleave", () => (tip.hidden = true));
    });
    host.append(svg, tip);
  }

  function kartuCekGudang() {
    const rg = D.retur_gudang;

    const unit = rg.unit.filter(ikut), acc = rg.acc.filter(ikut);

    const cocok = (u) => /^Cocok/.test(u.acc);

    const pillAcc = (u) => el("span", { class: "pill " + (cocok(u) ? "ok" : masalah(u) ? "bad" : "mut"), text: u.acc });
    const pillTahap = (u) => el("span", { class: "pill " + (u.tahap === "Selesai" ? "ok" : (u.umur || 0) > 7 ? "bad" : "warn"), text: u.tahap });

    // ringkasan per cabang (pusat) atau per tahap (halaman cabang)
    const kunci = S.cabang ? (u) => u.tahap : (u) => u.cabang;
    const g = new Map();
    for (const u of belum) {
      const k = kunci(u); let a = g.get(k);
      if (!a) { a = { key: k, unit: 0, lewat: 0, cocok: 0, masalah: 0 }; g.set(k, a); }
      const q = +u.qty || 1;
      a.unit += q; if ((u.umur || 0) > 7) a.lewat += q; if (cocok(u)) a.cocok += q; if (masalah(u)) a.masalah += q;
    }

    pilih.addEventListener("change", gambar);

    const kosong = (rg.meta.kosong || []).filter((c) => cocokCab(c));
    return el("div", { style: "display:grid;gap:16px" },

  }

  async function pRetur(sec) {

    const rn = D.retur_nota.filter(filt), pj = D.penjualan.filter(filt);

  // ---------- rute & uang jalan bisa diperbaiki tangan (Kak Intan 5 Nov 2026) ----------
  // "rute kiriman mau ada bisa edit disesuaikan dengan keadaan yang sebenarnya,

  //
  // Hitungan dashboard tetap jadi USULAN; apa yang benar-benar terjadi diisi di sini dan

  //   rute_ubah/<cabang|tanggal|toko>   -> toko ini sebenarnya dibawa mobil mana

  // SUDAH diambil supir dicatat terpisah; yang belum ada buktinya masuk rekap "potong gaji".
  const PARKIR_PER_TOKO = 5000;
  const UJ_KOLOM = [
    ["kenek", "Kenek"], ["parkir", "Parkir (toko × 5.000)"], ["klaim_parkir", "Klaim parkir"], ["parkir_gudang", "Parkir Laksana/Daan Mogot"],
    ["tol", "Tol"], ["lembur", "Lembur"], ["mel", "Mel (ormas)"], ["bongkar", "Bongkar"], ["kurang_solar", "Kekurangan solar"],

  const ujAngka = (v) => (v === "" || v === null || v === undefined ? null : Number(v) || 0);
  const ujParkir = (u, r) => (ujAngka((u || {}).parkir) ?? ((r && r.toko) || 0) * PARKIR_PER_TOKO);
  const ujTotal = (u, r) => {
    if (!u) return 0;
    const n = (k) => ujAngka(u[k]) || 0;

  // kotak uang jalan per mobil per hari: biaya, dana yang diambil supir, bukti (Drive per hari)

      o.rute = inp.rute.value.trim(); o.catatan = inp.catatan.value.trim();

    const segar = (isi) => {
      tot.textContent = rp(ujTotal(isi, r));

    pilihBerkas.addEventListener("change", async () => {

        el("label", { style: "display:grid;gap:2px;font-size:12px" }, el("span", { class: "muted", text: "Rute" }), inp.rute),

  // rekap potong gaji: dana uang jalan yang sudah diambil tapi belum ada bukti / melebihi biaya berbukti
  function kartuPotongGaji(cabang) {
    const rows = Object.values(S.ongkosUbah || {}).filter((u) => (!cabang || u.cabang === cabang) && ujPotong(u, u))
      .map((u) => ({ ...u, potong: ujPotong(u, u) }));
    if (!rows.length) return null;
    const per = new Map();
    for (const u of rows) { const k = u.supir || u.nopol; const a = per.get(k) || { supir: k, n: 0, total: 0 }; a.n++; a.total += u.potong; per.set(k, a); }
    const c = card("Potong gaji uang jalan", null,
      table([{ h: "Supir", f: (a) => a.supir }, { h: "Hari", f: (a) => a.n, num: true, fmt: nf0.format }, { h: "Total potong", f: (a) => a.total, num: true, fmt: rp }], [...per.values()], { sort: 2 }),
      table([{ h: "Tanggal", f: (u) => u.tanggal }, { h: "Supir", f: (u) => u.supir || "" }, { h: "Nopol", f: (u) => u.nopol },
        { h: "Dana diambil", f: (u) => ujAngka(u.dana_diambil) || 0, num: true, fmt: rp }, { h: "Biaya berbukti", f: (u) => (u.bukti || []).length ? ujTotal(u, u) : 0, num: true, fmt: rp },
        { h: "Potong gaji", f: (u) => u.potong, num: true, fmt: rp }], rows, { sort: 0, dir: "desc" }));
    c.dataset.kunci = "potong-gaji";
    return c;
  }

  async function pRute(sec) {

    const hariDari = (t) => t ? new Date(t).toLocaleDateString("id-ID", { weekday: "long", day: "numeric", month: "long" }) : "–";

    // tanggal & cabang
    const tgl = R.meta.tanggal;
    // rencana 7 hari ke depan dari pola kiriman 8 minggu (Kak Intan 30 Okt 2026); bawaan = hari nyata terakhir

    }

    const selTgl = el("select", { id: "ruteTgl", "aria-label": "Tanggal kirim" },

        text: isRencana ? "Kembali ke kiriman nyata" : "Lihat rencana 7 hari ke depan",
        onclick: () => { S.ruteTgl = isRencana ? tglNyata[tglNyata.length - 1] : [...tglRencana].sort()[0]; render(); } }) : null);
    const pesanRencana = false && isRencana ? el("div", { class: "msg", text: "RENCANA, bukan kiriman nyata. Pengiriman Pesanan baru dibuat saat barang berangkat dan pesanan penjualan Accurate tidak punya tanggal kirim ke depan, jadi rencana ini disusun dari kebiasaan: toko yang dikirimi pada hari " + new Date(S.ruteTgl).toLocaleDateString("id-ID", { weekday: "long" }) + " di sedikitnya " + RC.min_kali + " dari " + RC.minggu + " minggu terakhir (" + tglPanjang(RC.pola_dari) + " – " + tglPanjang(RC.pola_sampai) + "), dengan muatan rata-rata per kunjungan. Kolom No DO berisi seberapa rutin toko itu (mis. rutin 5/8). Toko yang memesan di luar kebiasaan belum masuk; begitu DO hari itu dibuat di Accurate, tanggal ini otomatis memakai DO asli." },
      (() => { const tt = (RC.total || {})[S.ruteCab + "|" + S.ruteTgl]; const rr = R.ringkasan.find((r) => r.cabang === S.ruteCab && r.tanggal === S.ruteTgl);
        return tt ? el("div", { style: "margin-top:6px;font-weight:600", text: "Perkiraan total muatan " + S.ruteCab + " hari itu (semua toko, rata-rata " + RC.minggu + " " + new Date(S.ruteTgl).toLocaleDateString("id-ID", { weekday: "long" }) + " terakhir): " + m3(tt.m3) + ", paling banyak " + m3(tt.maks) + ". Rute di bawah baru memuat toko rutin: " + m3(rr ? rr.m3 : 0) + " - sisanya cadangan untuk pesanan di luar kebiasaan." }) : null; })()) : null;

    // bar muatan: hijau sampai 85%, kuning di atasnya
    const bar = (muatan, volume) => {
      const p = volume ? Math.min(100, muatan / volume * 100) : 0;
      const batas = (R.meta.faktor_muat || 0.85) * 100;
      const warna = p > batas ? "var(--warn)" : "var(--ok)";
      return el("div", { style: "display:grid;gap:3px" },
        el("div", { style: "position:relative;height:14px;border-radius:7px;background:var(--line);overflow:hidden" },
          el("div", { style: "height:100%;width:" + p.toFixed(1) + "%;background:" + warna }),
          el("div", { title: "batas muat " + Math.round(batas) + "%", style: "position:absolute;top:0;bottom:0;left:" + batas + "%;width:2px;background:var(--fg);opacity:.45" })),
        el("div", { class: "muted", style: "font-size:12px", text: m3(muatan) + " dari " + m3(volume) + " (" + nf1.format(p) + "% penuh, garis = batas muat " + Math.round(batas) + "%)" }));

    const rits = R.rit.filter((r) => r.cabang === S.ruteCab && r.tanggal === S.ruteTgl)

      : el("span", { class: "muted", text: "–" });
    // filter mobil (Kak Intan 28 Okt 2026): semua mobil atau satu mobil saja, berlaku untuk ringkasan & rincian
    if (S.ruteMobil && !rits.some((r) => r.kunci.endsWith("|" + S.ruteMobil))) S.ruteMobil = "";
    const selMobil = el("select", { id: "ruteMobil", "aria-label": "Mobil" },

    const ritsTampil = S.ruteMobil ? rits.filter((r) => r.kunci.endsWith("|" + S.ruteMobil)) : rits;
    const barangRit = (kunci) => {
      const m = new Map();
      for (const t of R.rit_toko) if (t.kunci_rit === kunci) for (const [k, n, q] of t.barang || []) { const x = m.get(k) || [k, n, 0]; x[2] += q; m.set(k, x); }
      return [...m.values()].sort((a, b) => b[2] - a[2]);
    };
    const kolomToko = [
      { h: "Urut", f: (r) => r.urut, num: true, fmt: (v) => v || "–" },
      { h: "Toko", f: (r) => r.toko },
      { h: "Kota / kabupaten", f: (r) => r.kota },
      { h: "Arah dari gudang", f: (r) => r.arah || "–" },
      { h: "km dari gudang", f: (r) => r.km_dari_gudang, num: true, fmt: (v) => v == null ? el("span", { class: "muted", text: "belum ada titik" }) : nf1.format(v) },
      { h: "Pengiriman", f: (r) => r.do, num: true },
      { h: "Unit", f: (r) => r.unit, num: true, fmt: (v) => nf0.format(v) },
      { h: "Kubikasi", f: (r) => r.m3, num: true, fmt: (v) => m3(v), bar: true },
      { h: "Unit tanpa ukuran", f: (r) => r.tak_terukur_unit, num: true, fmt: (v) => v ? el("span", { class: "pill warn", text: nf0.format(v) + " unit" }) : el("span", { class: "muted", text: "–" }) },
      { h: "Barang diangkut", f: (r) => teksBarang(r.barang), node: (r) => nodeBarangRute(r.barang) },
      { h: "No. pengiriman", f: (r) => r.nomor_do, cls: "mono" },
      { h: "Mobil sebenarnya", f: (t) => (tokoDari(t) || {}).nopol || "",
        node: (t) => pilihMobilToko(t, nopolPilihan) },
    ];
    // nopol yang boleh dipilih waktu memindahkan toko: mobil cabang ini
    const nopolPilihan = [...new Set((R.mobil || []).filter((m) => m.cabang === S.ruteCab).map((m) => m.nopol))].sort();

      return el("div", { class: "card" },

            text: belum ? nf1.format(r.muatan_m3) + " m³ sisa" : r.jenis + " · " + m3(r.volume_m3) })),
        el("p", { class: "note", text: belum

            ? "Cabang ini belum ada data mobilnya di DATABASE MOBIL, jadi muatannya dihitung tapi belum bisa dibagi per mobil. Kirim daftar mobil cabang ini (nopol + ukuran box) dan pembagiannya langsung jalan."
            : "Muatan ini tidak kebagian mobil pada tanggal itu — perlu rit kedua, mobil tambahan, atau digeser ke hari berikutnya.")
          : "Jalur: " + r.jalur + (r.km != null ? " · perkiraan " + nf0.format(r.km) + " km pergi-pulang (" + r.sumber_km + ")" : "") }),
        belum ? null : bar(r.muatan_m3, r.volume_m3),
        !belum && r.target_nilai ? el("div", { style: "font-size:13px;margin:4px 0" },
          el("span", { class: "pill " + (r.cukup_jalan ? "ok" : "warn"), text: r.cukup_jalan ? "Cukup jalan" : "Belum cukup" }),
          " nilai muatan " + rpK(r.nilai || 0) + " · target " + r.target_jenis + " ± " + rpK(r.target_nilai) + " — " + (r.alasan_jalan || "")) : null,
        el("div", { class: "row", style: "gap:14px;flex-wrap:wrap;font-size:13px" },
          el("span", null, el("b", null, nf0.format(r.toko)), " toko"),
          el("span", null, el("b", null, nf0.format(r.do)), " pengiriman"),
          el("span", null, el("b", null, nf0.format(r.unit)), " unit"),
          belum ? null : el("span", null, "arah ", el("b", null, r.arah))),
        r.melebihi_mobil ? el("div", { class: "msg", text: "Satu toko ini saja muatannya sudah melebihi batas muat mobil — perlu dibagi dua kali jalan." }) : null,

    // uang jalan yang diisi tangan selalu menang atas perkiraan dashboard
    const ongkosNyata = (r) => { const t = ujTotal(ujDari(r), r); return t > 0 ? t : null; };
    const ongkosPakai = (r) => { const n = ongkosNyata(r); return n != null ? n : r.ongkos; };
    const sisaPakai = (r) => { const n = ongkosNyata(r); return n != null ? (r.laba || 0) - n : r.sisa; };
    const nodeOngkos = (r) => ongkosPakai(r) == null
      ? el("span", { class: "muted", style: "font-size:12px", text: r.nopol === "(belum terangkut)" ? "–" : r.sumber_ongkos || "–" })

  //   karyawan[]   rincian daftar gaji iCloud per karyawan per bulan (gapok -> potongan -> take home pay)
  //   pencatatan[] Pencatatan Gaji Accurate: tagihan vs sisa per komponen = dashboard pelunasan
  //   bpjs[]       bukti bayar BPJS di Accurate: hutang yang dilepas vs kas yang keluar; selisihnya
  //                sudah dicatat ke 7100.31 Pendapatan Lain-Lain (jadi pendapatan perusahaan)
  // Hanya dipasang di halaman pusat - tab ini tidak masuk daftar tab kunci.json cabang.
  const BLN_PANJANG = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus",
                       "September", "Oktober", "November", "Desember"];
  const blnNama = (m) => BLN_PANJANG[(+m || 1) - 1] || String(m);
  const POT_URUT = ["Tabungan supir", "Cicilan", "Klaim", "Outsourcing", "Potongan GST", "Potongan Svarna",
                    "Barang online", "Setoran", "Uang jalan", "Absensi", "Kasbon", "Urunan driver"];

  async function dataGaji() {
    const d = await muatLain("gaji").catch(() => null);
    if (d && !d._siap) {
      d._siap = true;
      d._pt = [...new Set(d.karyawan.map((r) => r.pt))].sort();
      d._bulan = [...new Set(d.karyawan.map((r) => r.bulan))].sort((a, b) => a - b);
    }
    return d;
  }
  const pesanGaji = (sec) => sec.replaceChildren(el("div", { class: "msg", text: "Data gaji belum ada - jalankan skrip\\dashboard_gaji.py dulu." }));
  // satu baris karyawan -> seluruh potongannya sebagai satu teks, buat kolom rincian
  const rinciPot = (r) => Object.entries(r.pot || {}).map(([k, v]) => k + " " + rp(v)).join(", ");
  // banding Coretax (Kak Intan 5 Nov 2026): r.ct = hasil rekon PPh 21 3 sumber (sheet BANDING, Agen PPh 21 Gaji),
  // hanya PT SVARNA DIPA. kat: cocok | selisih | a1 (BPMP dibatalkan -> bupot A1) | tanpa_ct | ganda | belum
  const KAT_CT = { cocok: ["ok", "cocok"], selisih: ["bad", "selisih"], a1: ["warn", "BPMP batal \u2192 A1"],
                   tanpa_ct: ["bad", "tidak ada di Coretax"], ganda: ["mut", "baris ganda"], belum: ["mut", "belum direkon"] };
  const katCT = (r) => r.ct ? r.ct.kat : (r.pt === "SVARNA DIPA" ? "belum" : "");
  const SARING_CT = [["", "Semua"], ["cocok", "Cocok"], ["tidak", "Semua yang tidak cocok"], ["selisih", "Selisih bruto/PPh"],
                     ["a1", "BPMP batal \u2192 A1"], ["tanpa_ct", "Tidak ada di Coretax"], ["belum", "Belum direkon"]];
  const lolosCT = (k) => !S.gajiCT || (S.gajiCT === "tidak" ? (k && k !== "cocok" && k !== "ganda") : k === S.gajiCT);
  const lolosTHP = (r) => !S.gajiTHP || (S.gajiTHP === "selisih" ? r.ragu : !r.ragu);
  const pilCT = (r) => {
    const k = katCT(r);
    if (!k) return el("span", { class: "muted", text: "\u2013" });
    const [c, t] = KAT_CT[k] || ["mut", k];
    const x = r.ct || {};
    const judul = (x.st || "") + (x.cab_ac ? " \u00b7 cabang Accurate " + x.cab_ac : "")
      + (x.b_ac != null || x.b_ct != null ? " \u00b7 bruto Accurate " + nf0.format(x.b_ac || 0) + " / Coretax " + nf0.format(x.b_ct || 0) : "");
    return el("span", { class: "pill " + c, text: t, title: judul });
  };
  const angkaAtauStrip = (v) => v == null ? "\u2013" : nf0.format(v);

  function saringGaji(d) {
    const pt = S.gajiPT === undefined ? "SVARNA DIPA" : S.gajiPT;
    const cari = String(S.gajiCari || "").trim().toUpperCase();
    return d.karyawan.filter((r) => (!pt || r.pt === pt)
      && (!S.gajiBulan || r.bulan === +S.gajiBulan)
      && (!S.gajiCab || r.cabang === S.gajiCab)
      && lolosCT(katCT(r)) && lolosTHP(r)
      && (!cari || r.nama.toUpperCase().includes(cari) || String(r.bagian || "").toUpperCase().includes(cari)));
  }

  async function pGaji(sec) {
    const d = await dataGaji();
    if (!d || !d.karyawan || !d.karyawan.length) return pesanGaji(sec);
    if (S.gajiPT === undefined) S.gajiPT = d._pt.includes("SVARNA DIPA") ? "SVARNA DIPA" : "";
    if (S.gajiBulan === undefined) S.gajiBulan = d._bulan[d._bulan.length - 1];
    const rows = saringGaji(d);
    const sePT = d.karyawan.filter((r) => !S.gajiPT || r.pt === S.gajiPT);
    const f = (rs, k) => rs.reduce((a, r) => a + (+r[k] || 0), 0);
    const potLain = f(rows, "pot_lain"), potTotal = f(rows, "pot_total");

    const selPT = el("select", { id: "gajiPT" }, el("option", { value: "", text: "Semua PT" }),
      d._pt.map((p) => el("option", { value: p, text: p, selected: p === S.gajiPT })));
    selPT.addEventListener("change", () => { S.gajiPT = selPT.value; S.gajiCab = ""; render(); });
    const selBln = el("select", { id: "gajiBulan" }, el("option", { value: "", text: "Semua bulan" }),
      d._bulan.map((m) => el("option", { value: m, text: blnNama(m), selected: +S.gajiBulan === m })));
    selBln.addEventListener("change", () => { S.gajiBulan = selBln.value; render(); });
    const cabs = [...new Set(sePT.map((r) => r.cabang))].sort();
    const selCab = el("select", { id: "gajiCab" }, el("option", { value: "", text: "Semua cabang" }),
      cabs.map((c) => el("option", { value: c, text: (d.meta.nama_cabang || {})[c] || c, selected: c === S.gajiCab })));
    selCab.addEventListener("change", () => { S.gajiCab = selCab.value; render(); });
    const inpCari = el("input", { id: "gajiCari", type: "search", placeholder: "nama / bagian", value: S.gajiCari || "", style: "min-width:14em" });
    inpCari.addEventListener("change", () => { S.gajiCari = inpCari.value; render(); });
    const selCT = el("select", { id: "gajiCT" },
      SARING_CT.map(([v, t]) => el("option", { value: v, text: t, selected: (S.gajiCT || "") === v })));
    selCT.addEventListener("change", () => { S.gajiCT = selCT.value; render(); });
    const selTHP = el("select", { id: "gajiTHP" },
      [["", "Semua"], ["cocok", "Cocok"], ["selisih", "Selisih"]].map(([v, t]) => el("option", { value: v, text: t, selected: (S.gajiTHP || "") === v })));
    selTHP.addEventListener("change", () => { S.gajiTHP = selTHP.value; render(); });

    // ringkas per bulan (ikut saringan PT & cabang, tidak ikut saringan bulan)
    const dasarBulan = d.karyawan.filter((r) => (!S.gajiPT || r.pt === S.gajiPT) && (!S.gajiCab || r.cabang === S.gajiCab));
    // baris rekon yang tidak ada di daftar gaji iCloud (d.rekon_lain) ikut dijumlah selama tidak disaring per
    // cabang, supaya total PPh Accurate/Coretax sama dengan rekon PPh 21 (sheet RINGKASAN BULAN)
    const pakaiLain = !S.gajiCab && (!S.gajiPT || S.gajiPT === "SVARNA DIPA");
    const lainBulan = (m) => pakaiLain ? (d.rekon_lain || []).filter((x) => x.bulan === m) : [];
    const perBulan = d._bulan.map((m) => {
      const rs = dasarBulan.filter((r) => r.bulan === m);
      const ls = lainBulan(m);
      return { bulan: m, orang: rs.length, bruto: f(rs, "bruto"), tk: f(rs, "tk_kar"), kes: f(rs, "kes_kar"),
        pph: f(rs, "pph21"), lain: f(rs, "pot_lain"), pot: f(rs, "pot_total"), thp: f(rs, "thp"),
        beban: f(rs, "tk_pk") + f(rs, "kes_pk"),
        pph_ac: rs.reduce((a, r) => a + ((r.ct && r.ct.p_ac) || 0), 0) + ls.reduce((a, x) => a + (x.p_ac || 0), 0),
        pph_ct: rs.reduce((a, r) => a + ((r.ct && r.ct.p_ct) || 0), 0) + ls.reduce((a, x) => a + (x.p_ct || 0), 0),
        tidak: rs.filter((r) => { const k = katCT(r); return k && k !== "cocok" && k !== "ganda"; }).length
          + ls.filter((x) => x.kat !== "cocok").length };
    });
    const perCab = [...new Set(rows.map((r) => r.cabang))].sort().map((c) => {
      const rs = rows.filter((r) => r.cabang === c);
      return { cabang: c, orang: rs.length, bruto: f(rs, "bruto"), pot: f(rs, "pot_total"), thp: f(rs, "thp"),
        beban: f(rs, "tk_pk") + f(rs, "kes_pk") };
    });
    const ragu = rows.filter((r) => r.ragu).length;

    const kolomKar = [
      { h: "Bulan", f: (r) => r.bulan, num: true, fmt: (v) => blnNama(v).slice(0, 3) },
      { h: "Cabang", f: (r) => r.cabang },
      { h: "Nama", f: (r) => r.nama },
      { h: "Bagian", f: (r) => r.bagian || "–" },
      { h: "PTKP", f: (r) => r.ptkp || "–" },
      { h: "Gapok", f: (r) => r.gapok, num: true, fmt: nf0.format },
      { h: "Tunjangan", f: (r) => r.tunjangan, num: true, fmt: nf0.format },
      { h: "Tambahan", f: (r) => r.tambahan, num: true, fmt: nf0.format },
      { h: "Bruto gaji", f: (r) => r.bruto, num: true, fmt: nf0.format, bar: true },
      { h: "BPJS TK (kar)", f: (r) => r.tk_kar, num: true, fmt: nf0.format },
      { h: "BPJS Kes (kar)", f: (r) => r.kes_kar, num: true, fmt: nf0.format },
      { h: "PPh 21", f: (r) => r.pph21, num: true, fmt: nf0.format },
      { h: "Potongan lain", f: (r) => r.pot_lain, num: true, fmt: nf0.format,
        node: (r) => r.pot_lain ? el("span", { title: rinciPot(r) }, nf0.format(r.pot_lain)) : el("span", { class: "muted", text: "–" }) },
      { h: "Total potongan", f: (r) => r.pot_total, num: true, fmt: nf0.format },
      { h: "Take home pay", f: (r) => r.thp || r.pendapatan, num: true, fmt: nf0.format, bar: true },
      { h: "PPh 21 Accurate", f: (r) => r.ct ? r.ct.p_ac : null, num: true, fmt: angkaAtauStrip },
      { h: "PPh 21 Coretax", f: (r) => r.ct ? r.ct.p_ct : null, num: true, fmt: angkaAtauStrip },
      { h: "Selisih PPh (Coretax \u2212 Accurate)", f: (r) => r.ct ? (r.ct.s_p || 0) : 0, num: true,
        node: (r) => r.ct && r.ct.s_p ? el("b", { style: "color:var(--bad)", text: nf0.format(r.ct.s_p) }) : el("span", { class: "muted", text: r.ct ? "0" : "\u2013" }) },
      { h: "Banding Coretax", f: (r) => katCT(r), node: pilCT },
      { h: "Cek THP", f: (r) => r.ragu ? 1 : 0, num: true,
        node: (r) => r.ragu ? el("span", { class: "pill warn", text: "selisih " + nf0.format(r.selisih_thp), title: r.sheet + " baris " + r.baris })
          : el("span", { class: "pill ok", text: "cocok" }) },
    ];

    sec.replaceChildren(
      el("div", { class: "card" },
        el("div", { class: "row", style: "gap:14px;flex-wrap:wrap" },
          el("label", { class: "ctl", for: "gajiPT" }, "PT", selPT),
          el("label", { class: "ctl", for: "gajiBulan" }, "Bulan", selBln),
          el("label", { class: "ctl", for: "gajiCab" }, "Cabang", selCab),
          el("label", { class: "ctl", for: "gajiCari" }, "Cari", inpCari),
          el("label", { class: "ctl", for: "gajiCT" }, "Banding Coretax", selCT),
          el("label", { class: "ctl", for: "gajiTHP" }, "Cek take home pay", selTHP))),
      el("div", { class: "kpis" },
        kpi("Karyawan", nf0.format(rows.length) + " orang", S.gajiBulan ? blnNama(S.gajiBulan) + " " + d.meta.tahun : "Jan–" + blnNama(d._bulan[d._bulan.length - 1])),
        kpi("Bruto gaji", rpK(f(rows, "bruto")), "gapok + tunjangan + tambahan gaji"),
        kpi("Total potongan", rpK(potTotal), "BPJS TK " + rpK(f(rows, "tk_kar")) + " · BPJS Kes " + rpK(f(rows, "kes_kar")) + " · PPh 21 " + rpK(f(rows, "pph21")) + " · lain " + rpK(potLain), "down"),
        kpi("Take home pay", rpK(f(rows, "thp")), "yang benar-benar ditransfer ke karyawan", "up"),
        kpi("Beban BPJS perusahaan", rpK(f(rows, "tk_pk") + f(rows, "kes_pk")), "di luar bruto gaji: TK " + rpK(f(rows, "tk_pk")) + " \u00b7 Kes " + rpK(f(rows, "kes_pk"))),
        (() => {
          const ad = rows.filter((r) => r.ct && r.ct.kat !== "ganda").map((r) => r.ct)
            .concat(S.gajiCari || S.gajiTHP ? [] : (d.rekon_lain || []).filter((x) => pakaiLain && (!S.gajiBulan || x.bulan === +S.gajiBulan) && lolosCT(x.kat)));
          if (!ad.length) return kpi("Banding Coretax", "\u2013", "hanya PT SVARNA DIPA");
          const ok = ad.filter((x) => x.kat === "cocok").length;
          const sp = ad.reduce((a, x) => a + (x.s_p || 0), 0);
          return kpi("Banding Coretax", nf0.format(ok) + " / " + nf0.format(ad.length) + " cocok",
            "selisih PPh Coretax \u2212 Accurate " + nf0.format(sp) + (d.meta.rekon_dibuat ? " \u00b7 rekon " + d.meta.rekon_dibuat.slice(0, 10) : ""),
            ok === ad.length ? "up" : "warn");
        })()),
      card("Per bulan", "Ikut saringan PT dan cabang di atas, tidak ikut saringan bulan. Beban perusahaan = iuran BPJS yang ditanggung PT (tidak memotong gaji karyawan).",
        table([
          { h: "Bulan", f: (r) => r.bulan, num: true, fmt: blnNama },
          { h: "Orang", f: (r) => r.orang, num: true, fmt: nf0.format },
          { h: "Bruto gaji", f: (r) => r.bruto, num: true, fmt: nf0.format, bar: true },
          { h: "BPJS TK", f: (r) => r.tk, num: true, fmt: nf0.format },
          { h: "BPJS Kes", f: (r) => r.kes, num: true, fmt: nf0.format },
          { h: "PPh 21", f: (r) => r.pph, num: true, fmt: nf0.format },
          { h: "Potongan lain", f: (r) => r.lain, num: true, fmt: nf0.format },
          { h: "Total potongan", f: (r) => r.pot, num: true, fmt: nf0.format },
          { h: "Take home pay", f: (r) => r.thp, num: true, fmt: nf0.format, bar: true },
          { h: "Beban BPJS PT", f: (r) => r.beban, num: true, fmt: nf0.format },
          { h: "PPh 21 Accurate", f: (r) => r.pph_ac, num: true, fmt: nf0.format },
          { h: "PPh 21 Coretax", f: (r) => r.pph_ct, num: true, fmt: nf0.format },
          { h: "Coretax \u2212 Accurate", f: (r) => r.pph_ct - r.pph_ac, num: true,
            node: (r) => (r.pph_ct - r.pph_ac) ? el("b", { style: "color:var(--bad)", text: nf0.format(r.pph_ct - r.pph_ac) }) : el("span", { class: "muted", text: "0" }) },
          { h: "Baris tidak cocok Coretax", f: (r) => r.tidak, num: true,
            node: (r) => r.tidak ? el("span", { class: "pill warn", text: nf0.format(r.tidak) }) : el("span", { class: "pill ok", text: "0" }) },
        ], perBulan, { sort: 0, dir: "asc" })),
      card("Per cabang", "Bulan yang sedang dipilih.",
        table([
          { h: "Cabang", f: (r) => (d.meta.nama_cabang || {})[r.cabang] || r.cabang },
          { h: "Orang", f: (r) => r.orang, num: true, fmt: nf0.format },
          { h: "Bruto gaji", f: (r) => r.bruto, num: true, fmt: nf0.format, bar: true },
          { h: "Total potongan", f: (r) => r.pot, num: true, fmt: nf0.format },
          { h: "Take home pay", f: (r) => r.thp, num: true, fmt: nf0.format, bar: true },
          { h: "Beban BPJS PT", f: (r) => r.beban, num: true, fmt: nf0.format },
        ], perCab, { sort: 2 })),
      card("Rincian per karyawan",
        "Angka apa adanya dari daftar gaji iCloud. Kolom PPh 21 Accurate/Coretax dan Banding Coretax dari rekon PPh 21 (Agen PPh 21 Gaji; hanya PT SVARNA DIPA) - arahkan kursor ke pil Banding Coretax untuk status rekon dan bruto kedua sumber. Kolom Cek THP membandingkan bruto gaji dikurangi seluruh potongan dengan take home pay yang tertulis; "
        + "kalau tidak sama berarti ada kolom potongan di luar bentuk baku - arahkan kursor ke pilnya untuk melihat sheet dan barisnya. "
        + (ragu ? ragu + " dari " + rows.length + " baris yang sedang tampil belum cocok." : "Semua baris yang tampil cocok."),
        table(kolomKar, rows, { sort: 8, limit: 150, maxH: "70vh" })),
      (() => {
        const lain = (d.rekon_lain || []).filter((x) => (!S.gajiBulan || x.bulan === +S.gajiBulan) && lolosCT(x.kat)
          && (!S.gajiPT || S.gajiPT === "SVARNA DIPA"));
        if (!lain.length) return null;
        return card("Rekon Coretax tanpa pasangan di daftar gaji",
          "Baris rekon PPh 21 (Accurate/Coretax) yang NIK-nya tidak ditemukan di daftar gaji iCloud bulan itu - misalnya NIK beda antar sumber, atau karyawan yang tidak masuk tabel gaji cabang. Cabang = kode cabang di Accurate.",
          table([
            { h: "Bulan", f: (r) => r.bulan, num: true, fmt: (v) => blnNama(v).slice(0, 3) },
            { h: "Cabang Accurate", f: (r) => r.cab_ac },
            { h: "Nama", f: (r) => r.nama },
            { h: "Bruto Accurate", f: (r) => r.b_ac, num: true, fmt: angkaAtauStrip },
            { h: "Bruto Coretax", f: (r) => r.b_ct, num: true, fmt: angkaAtauStrip },
            { h: "PPh 21 Accurate", f: (r) => r.p_ac, num: true, fmt: angkaAtauStrip },
            { h: "PPh 21 Coretax", f: (r) => r.p_ct, num: true, fmt: angkaAtauStrip },
            { h: "Status rekon", f: (r) => r.kat,
              node: (r) => el("span", { class: "pill " + (KAT_CT[r.kat] || ["mut"])[0], text: (KAT_CT[r.kat] || [0, r.kat])[1], title: r.st }) },
          ], lain, { sort: 0, dir: "asc", limit: 100 }));
      })(),
    );
  }

  // ---------- pelunasan Pencatatan Gaji ----------
  const KOMP_GAJI = ["Gaji", "PPh 21", "BPJS Kes", "BPJS TK", "Lebih potong PPh"];
  const tag = (r, k) => (r.komp[k] || [0, 0])[0];
  const sisa = (r, k) => (r.komp[k] || [0, 0])[1];

  async function pLunas(sec) {
    const d = await dataGaji();
    if (!d || !d.pencatatan || !d.pencatatan.length) return pesanGaji(sec);
    const bulanAda = [...new Set(d.pencatatan.map((r) => r.bulan))].sort((a, b) => a - b);
    const semua = d.pencatatan.filter((r) => (!S.lunasBulan || r.bulan === +S.lunasBulan)
      && (!S.lunasKomp || sisa(r, S.lunasKomp) !== 0)
      && (S.lunasSisa !== "belum" || r.sisa_total !== 0));
    const f = (rs, fn) => rs.reduce((a, r) => a + fn(r), 0);
    const belum = d.pencatatan.filter((r) => r.sisa_total !== 0);

    const selBln = el("select", { id: "lunasBulan" }, el("option", { value: "", text: "Semua bulan" }),
      bulanAda.map((m) => el("option", { value: m, text: blnNama(m), selected: +S.lunasBulan === m })));
    selBln.addEventListener("change", () => { S.lunasBulan = selBln.value; render(); });
    const selK = el("select", { id: "lunasKomp" }, el("option", { value: "", text: "Semua komponen" }),
      KOMP_GAJI.map((k) => el("option", { value: k, text: k, selected: k === S.lunasKomp })));
    selK.addEventListener("change", () => { S.lunasKomp = selK.value; render(); });
    const selS = el("select", { id: "lunasSisa" },
      el("option", { value: "belum", text: "Yang masih ada sisa", selected: S.lunasSisa !== "semua" }),
      el("option", { value: "semua", text: "Semua dokumen", selected: S.lunasSisa === "semua" }));
    selS.addEventListener("change", () => { S.lunasSisa = selS.value; render(); });

    const perBulan = bulanAda.map((m) => {
      const rs = d.pencatatan.filter((r) => r.bulan === m);
      const o = { bulan: m, dok: rs.length, belum: rs.filter((r) => r.sisa_total !== 0).length, total: 0 };
      for (const k of KOMP_GAJI) { o[k] = f(rs, (r) => sisa(r, k)); o.total += o[k]; }
      return o;
    });
    const perKomp = KOMP_GAJI.map((k) => ({
      komp: k, tagihan: f(d.pencatatan, (r) => tag(r, k)), sisa: f(d.pencatatan, (r) => sisa(r, k)),
      dok: d.pencatatan.filter((r) => sisa(r, k) !== 0).length, cara: (d.meta.cara_lunas || {})[k] || "",
    }));

    const kol = [
      { h: "Bulan", f: (r) => r.bulan, num: true, fmt: (v) => blnNama(v).slice(0, 3) },
      { h: "No Pencatatan Gaji", f: (r) => r.no },
      { h: "Cabang", f: (r) => r.cabang },
      { h: "Status Accurate", f: (r) => r.status,
        node: (r) => el("span", { class: "pill " + (r.sisa_total ? (r.status === "Terbayar" ? "warn" : "bad") : "ok"), text: r.status || "–" }) },

    db.collection("ongkos_ubah").onSnapshot((snap) => { if (!beda("ongkos_ubah", snap)) return;  S.ongkosUbah = {}; for (const d of snap.docs) S.ongkosUbah[d.id] = d.data(); if (S.page === "rute") ulang(); }, () => {});

    db.collection("harga_pindah").onSnapshot((snap) => { if (!beda("harga_pindah", snap)) return;  S.hargaPindah = {}; for (const d of snap.docs) S.hargaPindah[d.id] = d.data(); if (S.page === "pindah") ulang(); }, () => {});

  muat().then((boleh) => {

<script>
// Pengganti window.claude untuk halaman GitHub Pages: db / user / assets dilayani penyimpan Apps Script.
// Dipasang oleh kerangka sesudah sandi benar: pasangClaude({url, kunci, halaman}, nama).
// Halaman dashboard memakai API yang sama dengan artifact (collection().onSnapshot / add, doc().set / update / delete),
// jadi kode tab Pengajuan sales tidak perlu diubah.
function pasangClaude(isian, nama) {
  const HAL = isian.halaman, BERSAMA = ['pengajuan', 'pindah_barang'];
  const cache = {}, pendengar = {};
  let sejak = 0, sibuk = false, siap = false;
  const panggil = async (isi) => {
    // text/plain = permintaan sederhana, tanpa preflight CORS ke Apps Script
    const r = await fetch(isian.url, { method: 'POST', headers: { 'content-type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ halaman: HAL, kunci: isian.kunci, oleh: HAL + ':' + nama, ...isi }) });
    const j = await r.json();
    if (!j.ok) {
      const g = j.galat || 'gagal';
      // 20 Nov 2026: kalau penyimpan Apps Script belum di-deploy ulang, koleksi baru ditolak dan fiturnya
      // gagal diam-diam (cuma "tidak tersimpan" kecil di tabel). Sekarang ditulis jelas di bar sambungan.
      if (/koleksi tidak dikenal/.test(g)) tanda('Penyimpan Apps Script masih versi lama: ' + g + ' - minta deploy ulang dulu', true);
      const e = new Error(g); e.code = /hanya untuk pusat|tidak boleh|cabang/.test(g) ? 'permission_denied' : 'invalid_argument'; throw e;
    }
    return j;
  };
  const snap = (k) => ({ docs: Object.entries(cache[k] || {}).map(([id, d]) => ({ id, data: () => JSON.parse(JSON.stringify(d)) })) });
  const kabari = (k) => (pendengar[k] || []).forEach((f) => { try { f(snap(k)); } catch (e) { console.error(e); } });
  async function tarik() {
    if (sibuk) return; sibuk = true;
    try {
      const j = await panggil({ aksi: 'daftar', sejak });
      const ubah = new Set();
      for (const d of j.docs) {
        if (!BERSAMA.includes(d.koleksi) && d.halaman !== HAL) continue;
        const c = cache[d.koleksi] || (cache[d.koleksi] = {});
        if (d.dihapus) delete c[d.id]; else c[d.id] = d.data;
        ubah.add(d.koleksi);
        sejak = Math.max(sejak, d.diubah);
      }
      if (!siap) { siap = true; Object.keys(pendengar).forEach(kabari); } else ubah.forEach(kabari);
      tanda('tersambung · ' + new Date().toLocaleTimeString('id-ID'));
    } catch (e) { tanda('penyimpan tidak terjangkau (' + (e.message || e) + ')', true); }
    finally { sibuk = false; }
  }
  const tanda = (t, buruk) => { const s = document.getElementById('webSambung'); if (s) { s.textContent = t; s.style.color = buruk ? '#f08a80' : ''; } };
  const jalan = () => { tarik(); setTimeout(jalan, document.hidden ? 15000 : 4000); };
  const tulis = async (koleksi, id, mode, data) => {
    const j = await panggil({ aksi: 'tulis', koleksi, id, mode, data });
    const h = j.hasil[0];
    const c = cache[koleksi] || (cache[koleksi] = {});
    if (mode === 'delete') delete c[h.id];
    else c[h.id] = mode === 'update' ? { ...(c[h.id] || {}), ...data } : data;
    kabari(koleksi);
    setTimeout(tarik, 300);
    return h;
  };
  const dokumen = (path) => {
    const i = path.indexOf('/'), k = path.slice(0, i), id = path.slice(i + 1);
    return { set: (d) => tulis(k, id, 'set', d), update: (d) => tulis(k, id, 'update', d), delete: () => tulis(k, id, 'delete') };
  };
  const db = {
    collection: (k) => ({
      onSnapshot(cb) { (pendengar[k] || (pendengar[k] = [])).push(cb); if (siap) cb(snap(k)); return () => { pendengar[k] = pendengar[k].filter((f) => f !== cb); }; },
      add: async (d) => { const h = await tulis(k, '', 'add', d); return { id: h.id }; },
      doc: (id) => dokumen(k + '/' + id),
    }),
    doc: dokumen,
  };
  // pusat: nama penyetuju apa adanya (dicatat di acc_oleh); cabang: admin-<cabang>:<nama>
  const uid = HAL === 'pusat' ? nama : 'admin-' + HAL + ':' + nama;
  const user = { id: async () => uid, can: async () => true };
  const bacaB64 = (f) => new Promise((ok, gagal) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = gagal; r.readAsDataURL(f); });
  const assets = { upload: async (f, o) => {
    if (f.size > 15 * 1024 * 1024) { const e = new Error('besar'); e.code = 'too_large'; throw e; }
    const j = await panggil({ aksi: 'unggah', tipe: (o && o.type) || f.type, nama: (o && o.nama) || f.name, folder: (o && o.folder) || '', b64: await bacaB64(f) });
    return { url: j.url, id: j.id };
  } };
  const layanan = { db, user, assets, mcp: null };
  window.claude = { use: async (n) => (n in layanan ? layanan[n] : null) };
  jalan();
}

// Pencarian barang / toko yang langsung mengikuti ketikan (Kak Intan 14 Nov 2026: datalist bawaan browser
// lambat & tidak ikut berubah - ketik "7bey" yang muncul masih hasil "5bey").
// Semua <input list="..."> diganti otomatis: saran disaring tiap ketikan, cocok di tengah kode ("5bey" -> AHA5BEY),
// kode yang diawali ketikan tampil paling atas. Panah atas/bawah + Enter, Esc menutup. Nilai input tetap teks biasa,
// jadi kode halaman lain tidak berubah.
(function () {
  const MAKS = 40;
  const norm = (s) => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
  const cache = new Map();
  let kotak = null, aktif = null, pilihan = [], idx = -1;

  function opsi(id) {
    const dl = document.getElementById(id);
    if (!dl) return [];
    const c = cache.get(id);
    if (c && c.n === dl.childElementCount && c.dl === dl) return c.isi;
    const isi = [...dl.options].map((o) => { const v = o.value, l = o.label && o.label !== v ? o.label : (o.text && o.text !== v ? o.text : "");
      return { v, l, nv: norm(v), nl: norm(l) }; });
    cache.set(id, { dl, n: dl.childElementCount, isi });
    return isi;
  }
  function saring(id, q) {
    const n = norm(q), semua = opsi(id);
    if (!n) return semua.slice(0, MAKS);
    const a = [], b = [], c = [];
    for (const o of semua) {
      if (o.nv.startsWith(n)) a.push(o); else if (o.nv.includes(n)) b.push(o); else if (o.nl.includes(n)) c.push(o);
      if (a.length >= MAKS) break;
    }
    return a.concat(b, c).slice(0, MAKS);
  }
  function tutup() { if (kotak) kotak.hidden = true; idx = -1; }
  function pakai(o) {
    if (!aktif || !o) return;
    aktif.value = o.v;
    aktif.dispatchEvent(new Event("input", { bubbles: true }));
    aktif.dispatchEvent(new Event("change", { bubbles: true }));
    tutup();
  }
  function tandai() {
    [...kotak.children].forEach((d, i) => { d.style.background = i === idx ? "rgba(120,170,220,.28)" : ""; });
    if (idx >= 0 && kotak.children[idx]) kotak.children[idx].scrollIntoView({ block: "nearest" });
  }
  function tampil(inp) {
    if (!kotak) {
      kotak = document.createElement("div");
      kotak.setAttribute("role", "listbox");
      kotak.style.cssText = "position:fixed;z-index:9999;max-height:320px;overflow:auto;background:#1b232b;color:#e6ecf1;" +
        "border:1px solid rgba(255,255,255,.18);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.45);font-size:14px;padding:4px 0";
      kotak.addEventListener("mousedown", (e) => e.preventDefault());
      document.body.appendChild(kotak);
    }
    aktif = inp;
    pilihan = saring(inp.dataset.daftar, inp.value);
    kotak.replaceChildren(...pilihan.map((o, i) => {
      const d = document.createElement("div");
      d.setAttribute("role", "option");
      d.style.cssText = "padding:6px 12px;cursor:pointer;line-height:1.25";
      const k = document.createElement("div"); k.textContent = o.v; k.style.fontWeight = "600";
      d.appendChild(k);
      if (o.l) { const s = document.createElement("div"); s.textContent = o.l; s.style.cssText = "font-size:12px;opacity:.75"; d.appendChild(s); }
      d.addEventListener("click", () => pakai(o));
      d.addEventListener("mouseenter", () => { idx = i; tandai(); });
      return d;
    }));
    if (!pilihan.length) { const d = document.createElement("div"); d.textContent = "tidak ada yang cocok"; d.style.cssText = "padding:6px 12px;opacity:.6"; kotak.appendChild(d); }
    const r = inp.getBoundingClientRect();
    kotak.style.left = r.left + "px";
    kotak.style.width = Math.max(r.width, 280) + "px";
    const bawah = window.innerHeight - r.bottom;
    if (bawah < 200 && r.top > bawah) { kotak.style.top = ""; kotak.style.bottom = (window.innerHeight - r.top + 4) + "px"; }
    else { kotak.style.bottom = ""; kotak.style.top = (r.bottom + 4) + "px"; }
    kotak.hidden = false; idx = -1;
  }
  function pasang(inp) {
    if (inp.dataset.daftar) return;
    inp.dataset.daftar = inp.getAttribute("list");
    inp.removeAttribute("list");
    inp.setAttribute("autocomplete", "off");
    inp.addEventListener("input", (e) => { if (e.isTrusted) tampil(inp); });
    inp.addEventListener("focus", () => tampil(inp));
    inp.addEventListener("blur", () => setTimeout(() => { if (aktif === inp) tutup(); }, 150));
    inp.addEventListener("keydown", (e) => {
      if (!kotak || kotak.hidden || aktif !== inp) return;
      if (e.key === "ArrowDown") { idx = Math.min(idx + 1, pilihan.length - 1); tandai(); e.preventDefault(); }
      else if (e.key === "ArrowUp") { idx = Math.max(idx - 1, 0); tandai(); e.preventDefault(); }
      else if (e.key === "Enter" && idx >= 0) { pakai(pilihan[idx]); e.preventDefault(); }
      else if (e.key === "Escape") tutup();
    });
  }
  const pindai = (n) => {
    if (n.nodeType !== 1) return;
    if (n.matches && n.matches("input[list]")) pasang(n);
    if (n.querySelectorAll) n.querySelectorAll("input[list]").forEach(pasang);
  };
  new MutationObserver((ms) => { for (const m of ms) m.addedNodes.forEach(pindai); }).observe(document.documentElement, { childList: true, subtree: true });
  window.addEventListener("scroll", (e) => { if (e.target !== kotak && kotak && !kotak.hidden && aktif) tampil(aktif); }, true);
  window.addEventListener("resize", tutup);
  document.addEventListener("DOMContentLoaded", () => pindai(document.body));
})();

try { const n = localStorage.getItem("pengajuan_nama"); if (n) document.getElementById("nama").value = n; } catch (e) {}

  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  async function buka(sandi) {
    const r = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('Data tidak bisa diambil (' + r.status + ')');
    const p = await r.json();
    if (p.polos) return JSON.parse(await new Response(new Blob([b64(p.polos)]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
    const bahan = await crypto.subtle.importKey('raw', new TextEncoder().encode(sandi), 'PBKDF2', false, ['deriveKey']);
    const kunci = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(p.garam), iterations: p.iter, hash: 'SHA-256' },
      bahan, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    let polos;
    try { polos = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(p.iv) }, kunci, b64(p.isi)); }
    catch (e) { throw new Error('Sandi salah. Coba lagi.'); }
    const aliran = new Blob([polos]).stream().pipeThrough(new DecompressionStream('gzip'));
    return JSON.parse(await new Response(aliran).text());
  }
  // Kak Intan 18 Nov 2026: tab Gaji / Pelunasan gaji / BPJS bersandi, tab lain tetap terbuka.
  // data/gaji.json hanya ada terkunci AES-GCM di paket.gaji; dibuka di browser sesudah sandi benar.
  const TAB_GAJI = ['gaji', 'lunas', 'bpjs'];
  let janjiGaji = null, kotakGaji = null;
  async function bukaGaji(g, sandi) {
    const bahan = await crypto.subtle.importKey('raw', new TextEncoder().encode(sandi), 'PBKDF2', false, ['deriveKey']);
    const kunci = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(g.garam), iterations: g.iter, hash: 'SHA-256' },
      bahan, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const polos = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(g.iv) }, kunci, b64(g.isi));
    return new Response(new Blob([polos]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  }
  function aturKotakGaji() {
    if (!kotakGaji) return;
    const t = document.querySelector('.tab[aria-selected="true"]');
    kotakGaji.hidden = !TAB_GAJI.includes(t ? t.dataset.p : location.hash.slice(1));
    if (!kotakGaji.hidden) setTimeout(() => kotakGaji.querySelector('input').focus(), 0);
  }
  function mintaGaji(g) {
    if (!janjiGaji) janjiGaji = new Promise((ok) => {
      const k = document.createElement('div');
      k.id = 'kunciGaji';
      k.setAttribute('style', 'position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:rgba(10,14,18,.72);padding:16px');
      k.innerHTML = '<form style="width:min(420px,100%);background:#11171d;color:#e6ecf1;border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:28px;display:grid;gap:14px;font:18px/1.4 \'Aptos Narrow\',\'Arial Narrow\',system-ui,sans-serif;text-align:center">'
        + '<b style="font-size:22px;letter-spacing:.12em;text-transform:uppercase">Data gaji</b>'
        + '<span style="color:#9aa8b5;font-size:16px">Tab Gaji, Pelunasan gaji, dan BPJS dikunci. Masukkan sandi untuk membuka.</span>'
        + '<input type="password" autocomplete="current-password" placeholder="Sandi" required style="height:56px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:#2b6382;color:#fff;font:600 20px \'Aptos Narrow\',sans-serif;text-align:center">'
        + '<span class="galatGaji" style="color:#ffb4a8;min-height:1.4em;font-size:16px"></span>'
        + '<span style="display:flex;gap:10px;justify-content:center"><button type="submit" style="flex:1;height:48px;border-radius:999px;border:0;background:#e6ecf1;color:#11171d;font:700 17px \'Aptos Narrow\',sans-serif;cursor:pointer">Buka</button>'
        + '<button type="button" class="batalGaji" style="flex:1;height:48px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#e6ecf1;font:700 17px \'Aptos Narrow\',sans-serif;cursor:pointer">Tab lain</button></span></form>';
      document.body.appendChild(k);
      kotakGaji = k;
      const f = k.querySelector('form'), inp = k.querySelector('input'), gl = k.querySelector('.galatGaji');
      k.querySelector('.batalGaji').addEventListener('click', () => {
        const b = document.querySelector('.tab[data-p="pengajuan"]') || [...document.querySelectorAll('.tab')].find((x) => !TAB_GAJI.includes(x.dataset.p));
        if (b) b.click(); else kotakGaji.hidden = true;
      });
      f.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        gl.textContent = 'Sedang membuka...';
        try { const t = await bukaGaji(g, inp.value); k.remove(); kotakGaji = null; ok(t); }
        catch (e) { gl.textContent = 'Sandi salah. Coba lagi.'; inp.value = ''; inp.focus(); }
      });
      window.addEventListener('hashchange', aturKotakGaji);
      // tab dashboard berganti lewat klik (history.replaceState, tanpa hashchange)
      document.addEventListener('click', () => setTimeout(aturKotakGaji, 0), true);
      aturKotakGaji();
    });
    else aturKotakGaji();
    return janjiGaji.then((t) => new Response(t, { headers: { 'content-type': 'application/json' } }));
  }
  // halaman dashboard membaca data/<nama>.json lewat fetch: dilayani dari paket yang sudah dibuka
  function pasangHalaman(paket) {
    const BERKAS = paket.berkas, asli = window.fetch.bind(window);
    window.fetch = (u, o) => {
      const p = String(u).split('?')[0].replace(/^\.\//, '');
      if (p === 'data/gaji.json' && paket.gaji) return mintaGaji(paket.gaji);
      if (p in BERKAS) return Promise.resolve(new Response(BERKAS[p], { headers: { 'content-type': 'application/json' } }));
      if (p.startsWith('data/')) return Promise.resolve(new Response('', { status: 404 }));
      return asli(u, o);
    };
    const isi = document.getElementById('isi');
    const t = document.getElementById('halaman').content.cloneNode(true);
    const skrip = [...t.querySelectorAll('script')];
    skrip.forEach((s) => s.remove());
    const judul = t.querySelector('title');
    if (judul) { document.title = judul.textContent; judul.remove(); }
    isi.appendChild(t);
    isi.hidden = false;
    skrip.forEach((s) => { const n = document.createElement('script'); n.textContent = s.textContent; isi.appendChild(n); });
  }
  document.getElementById('masuk').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const g = document.getElementById('galat');
    g.textContent = 'Sedang membuka…';
    try {
      const nm = document.getElementById('nama').value.trim();
      const paket = await buka(document.getElementById('sandi').value);
      document.getElementById('masuk').remove();
      document.getElementById('webDibuat').textContent = new Date(paket.dibuat).toLocaleString('id-ID', { dateStyle: 'long', timeStyle: 'short' });
      document.getElementById('webKaki').hidden = false;
      try { localStorage.setItem("pengajuan_nama", nm); } catch (e) {}
      if (paket.isian && paket.isian.url) pasangClaude(paket.isian, nm);
      else document.getElementById("webSambung").textContent = "penyimpan belum dipasang - isian belum bisa disimpan";
      if (!location.hash) history.replaceState(null, "", "#pengajuan");
      pasangHalaman(paket);
    } catch (e) {
      g.textContent = e.message;
      document.getElementById('sandi').value = '';
      document.getElementById('sandi').focus();
    }
  });
  document.getElementById('webKeluar').addEventListener('click', (e) => { e.preventDefault(); location.reload(); });
  if (document.getElementById('nama').value) document.getElementById('masuk').requestSubmit();
</script>
